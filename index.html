<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ZIP Lookup + Test Name Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #10231a;
        --ink-soft: #40584c;
        --ink-faint: #71867a;
        --line: #dcebe1;
        --green: #00a878;
        --green-dark: #087255;
        --lime: #82c341;
        --cyan: #00a6c8;
        --yellow: #ffdf5d;
        --paper: rgba(255, 255, 255, .96);
        --shadow: 0 24px 70px rgba(0, 0, 0, .28);
        --card-shadow: 0 18px 46px rgba(0, 0, 0, .22);
      }

      * { box-sizing: border-box; }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        color: #eefaf3;
        font-family: "Sora", "Museo Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        line-height: 1.5;
        background:
          radial-gradient(circle at 12% 16%, rgba(64, 255, 190, .24), transparent 28rem),
          radial-gradient(circle at 88% 8%, rgba(0, 174, 255, .26), transparent 30rem),
          radial-gradient(circle at 72% 88%, rgba(130, 195, 65, .16), transparent 26rem),
          linear-gradient(135deg, #02130f 0%, #063c33 34%, #073763 68%, #12082e 100%);
        background-size: 145% 145%;
        animation: pageGradient 16s ease-in-out infinite alternate;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -3;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: radial-gradient(circle at 50% 24%, black 0, transparent 78%);
        -webkit-mask-image: radial-gradient(circle at 50% 24%, black 0, transparent 78%);
        animation: gridDrift 24s linear infinite;
      }
      body::after {
        content: "";
        position: fixed;
        width: 44vw;
        height: 44vw;
        min-width: 340px;
        min-height: 340px;
        right: -14vw;
        top: 42vh;
        z-index: -2;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(0, 213, 197, .20), rgba(0, 213, 197, 0) 66%);
        animation: ambientFloat 13s ease-in-out infinite alternate;
      }
      @keyframes pageGradient {
        from { background-position: 0% 30%; }
        to { background-position: 100% 70%; }
      }
      @keyframes gridDrift {
        from { background-position: 0 0, 0 0; }
        to { background-position: 54px 54px, 54px 54px; }
      }
      @keyframes ambientFloat {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to { transform: translate3d(-4vw, -5vh, 0) scale(1.12); }
      }

      .scene {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .orb {
        position: absolute;
        display: block;
        border-radius: 50%;
        filter: blur(2px);
      }
      .orb-one {
        width: 190px; height: 190px;
        left: 5vw; top: 58vh;
        background: radial-gradient(circle at 35% 35%, rgba(155, 227, 61, .34), rgba(155, 227, 61, 0) 68%);
        animation: orbFloat 11s ease-in-out infinite alternate;
      }
      .orb-two {
        width: 260px; height: 260px;
        right: 6vw; top: 12vh;
        background: radial-gradient(circle at 40% 40%, rgba(56, 213, 197, .30), rgba(56, 213, 197, 0) 68%);
        animation: orbFloat 14s ease-in-out infinite alternate-reverse;
      }
      .orb-three {
        width: 130px; height: 130px;
        left: 46vw; bottom: 6vh;
        background: radial-gradient(circle at 40% 40%, rgba(255, 223, 93, .22), rgba(255, 223, 93, 0) 68%);
        animation: orbFloat 9s ease-in-out infinite alternate;
      }
      .beam {
        position: absolute;
        display: block;
        width: 42vw;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .28), transparent);
        transform: rotate(-18deg);
        animation: beamDrift 12s ease-in-out infinite alternate;
      }
      .beam-one { left: -8vw; top: 24vh; }
      .beam-two { right: -10vw; bottom: 20vh; animation-delay: -5s; }
      @keyframes orbFloat {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to { transform: translate3d(24px, -30px, 0) scale(1.08); }
      }
      @keyframes beamDrift {
        from { transform: translateX(-18px) rotate(-18deg); opacity: .35; }
        to { transform: translateX(30px) rotate(-18deg); opacity: .85; }
      }

      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 5px;
        z-index: 30;
        background: linear-gradient(90deg, #00a878, #82c341, #00a6c8, #ffdf5d, #00a878);
        background-size: 220% 100%;
        animation: topSlide 5s linear infinite;
        box-shadow: 0 0 18px rgba(130, 195, 65, .55);
      }
      @keyframes topSlide { to { background-position: 220% 0; } }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin: 0 auto;
        padding: 34px 20px 46px;
      }

      /* ---------- Immersive map hero ---------- */
      .hero {
        position: relative;
        min-height: 372px;
        display: flex;
        align-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .24);
        border-radius: 36px;
        padding: 52px 56px 64px;
        background:
          linear-gradient(105deg, rgba(2, 34, 28, .92), rgba(3, 64, 54, .72) 48%, rgba(3, 41, 74, .52)),
          radial-gradient(circle at 78% 45%, rgba(72, 255, 202, .22), transparent 21rem);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 -50px 80px rgba(0, 0, 0, .16), 0 30px 80px rgba(0, 0, 0, .38);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        animation: heroIn .85s cubic-bezier(.22, .8, .35, 1) both;
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 620px; height: 620px;
        right: -100px; top: 50%;
        transform: translateY(-50%);
        border-radius: 50%;
        background: repeating-radial-gradient(circle, transparent 0 34px, rgba(255, 255, 255, .055) 35px, transparent 36px);
        pointer-events: none;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 45%;
        background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .07));
        pointer-events: none;
      }
      @keyframes heroIn {
        from { opacity: 0; transform: translateY(22px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .hero-content {
        position: relative;
        z-index: 4;
        max-width: 650px;
      }
      .brand-line {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 22px;
        padding: 9px 13px;
        border: 1px solid rgba(255, 255, 255, .24);
        border-radius: 999px;
        background: rgba(255, 255, 255, .12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .02em;
        line-height: 1;
        animation: riseIn .65s cubic-bezier(.22, .8, .35, 1) .08s both;
      }
      .brand-line::before {
        content: "";
        width: 9px; height: 9px;
        flex: none;
        border-radius: 50%;
        background: #9be33d;
        box-shadow: 0 0 0 0 rgba(155, 227, 61, .65);
        animation: livePulse 1.8s ease-out infinite;
      }
      @keyframes livePulse {
        0% { box-shadow: 0 0 0 0 rgba(155, 227, 61, .65); }
        70% { box-shadow: 0 0 0 9px rgba(155, 227, 61, 0); }
        100% { box-shadow: 0 0 0 0 rgba(155, 227, 61, 0); }
      }
      .brand-line span {
        color: #c9f7a7;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      header.intro { margin: 0; }
      header.intro h1 {
        max-width: 650px;
        margin: 0;
        color: transparent;
        font-size: clamp(43px, 7vw, 78px);
        font-weight: 800;
        letter-spacing: -.055em;
        line-height: .98;
        background: linear-gradient(100deg, #ffffff 15%, #d7ffb8 38%, #ffffff 58%, #a9ecff 78%, #ffffff 95%);
        background-size: 230% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: riseIn .7s cubic-bezier(.22, .8, .35, 1) .16s both, titleShine 5.5s linear infinite;
      }
      @keyframes titleShine {
        from { background-position: 120% 0; }
        to { background-position: -120% 0; }
      }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .map-scene {
        position: absolute;
        z-index: 2;
        right: 48px;
        top: 50%;
        width: 332px;
        height: 332px;
        transform: translateY(-50%);
        pointer-events: none;
      }
      .map-disc {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .38);
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .24), transparent 28%),
          linear-gradient(145deg, #14765d, #0a4f5b 58%, #073763);
        box-shadow: inset 0 0 0 12px rgba(255, 255, 255, .06), inset 0 -36px 60px rgba(0, 0, 0, .24), 0 28px 60px rgba(0, 0, 0, .34);
        animation: mapFloat 7s ease-in-out infinite alternate;
      }
      .map-disc svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .route-path {
        stroke-dasharray: 12 9;
        animation: routeMove 1.35s linear infinite;
      }
      @keyframes routeMove { to { stroke-dashoffset: -42; } }
      @keyframes mapFloat {
        from { transform: translateY(-4px) rotate(-.4deg); }
        to { transform: translateY(7px) rotate(.5deg); }
      }
      .radar-ring {
        position: absolute;
        inset: 18px;
        border: 2px solid rgba(125, 255, 213, .48);
        border-radius: 50%;
        animation: radar 3.2s ease-out infinite;
      }
      .radar-ring.delay { animation-delay: 1.6s; }
      @keyframes radar {
        from { opacity: .85; transform: scale(.58); }
        to { opacity: 0; transform: scale(1.12); }
      }
      .hero-pin {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 43%;
        font-size: 56px;
        line-height: 1;
        filter: drop-shadow(0 14px 9px rgba(0, 0, 0, .38));
        animation: mapPin 2.2s ease-in-out infinite;
      }
      @keyframes mapPin {
        0%, 100% { transform: translate(-50%, -100%) translateY(0) scale(1, 1); }
        30% { transform: translate(-50%, -100%) translateY(-17px) scale(.96, 1.05); }
        55% { transform: translate(-50%, -100%) translateY(0) scale(1.06, .94); }
        72% { transform: translate(-50%, -100%) translateY(-6px) scale(1, 1); }
      }
      .wave {
        position: absolute;
        z-index: 1;
        left: 0;
        bottom: -3px;
        width: 200%;
        height: 28px;
        opacity: .55;
        pointer-events: none;
        animation: waveSlide 9s ease-in-out infinite alternate;
      }
      .wave svg { display: block; width: 100%; height: 100%; }
      @keyframes waveSlide {
        from { transform: translateX(0); }
        to { transform: translateX(-24%); }
      }

      /* ---------- Floating search dock ---------- */
      .panel {
        border: 1px solid rgba(255, 255, 255, .68);
        background: var(--paper);
        color: var(--ink);
        box-shadow: var(--card-shadow);
      }
      .lookup {
        position: relative;
        z-index: 5;
        margin: -36px 24px 26px;
        padding: 28px;
        overflow: hidden;
        border-radius: 30px;
        background: linear-gradient(135deg, rgba(255, 255, 255, .98), rgba(239, 255, 246, .94));
        box-shadow: 0 28px 70px rgba(0, 0, 0, .30), inset 0 1px 0 #ffffff;
        animation: dockIn .75s cubic-bezier(.22, .8, .35, 1) .18s both;
      }
      .lookup::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 5px;
        background: linear-gradient(90deg, var(--green), var(--lime), var(--cyan), var(--green));
        background-size: 200% 100%;
        animation: topSlide 5s linear infinite;
      }
      @keyframes dockIn {
        from { opacity: 0; transform: translateY(24px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .lookup label {
        display: block;
        margin-bottom: 10px;
        color: var(--green-dark);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .lookup-row {
        display: flex;
        align-items: stretch;
        flex-wrap: wrap;
        gap: 12px;
      }
      .zip-input {
        flex: 1 1 220px;
        min-width: 0;
        min-height: 66px;
        padding: 14px 18px;
        border: 2px solid #b8d8c2;
        border-radius: 19px;
        outline: none;
        background: linear-gradient(180deg, #ffffff, #f2fff6);
        box-shadow: inset 0 3px 10px rgba(8, 114, 85, .07);
        color: #0a2d20;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: .16em;
        transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      }
      .zip-input::placeholder { color: #8ba698; letter-spacing: .08em; }
      .zip-input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 5px rgba(0, 168, 120, .16), inset 0 3px 10px rgba(8, 114, 85, .05);
        transform: translateY(-1px);
      }
      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 52px;
        padding: 13px 23px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 999px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: translateY(1px) scale(.985); }
      .btn-primary {
        background: linear-gradient(90deg, #008c66, #00a878, #54c82d, #00a878);
        background-size: 220% 100%;
        color: #ffffff;
        box-shadow: 0 14px 30px rgba(0, 151, 102, .32);
        animation: buttonFlow 3.6s linear infinite;
      }
      @keyframes buttonFlow { to { background-position: 220% 0; } }
      .btn-primary::after {
        content: "";
        position: absolute;
        top: 0;
        left: -75%;
        width: 42%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .48), transparent);
        transform: skewX(-20deg);
        transition: left .55s ease;
        pointer-events: none;
      }
      .btn-primary:hover::after { left: 135%; }
      .btn-primary:disabled { opacity: .58; cursor: wait; }
      .lookup .btn-primary { min-height: 66px; padding-inline: 28px; }
      .btn-ghost {
        border-color: #9fc9ae;
        background: rgba(255, 255, 255, .94);
        color: var(--green-dark);
        box-shadow: 0 10px 24px rgba(0, 0, 0, .12);
      }
      .btn-ghost:hover { background: #eefaf1; }
      .btn-small { min-height: 38px; padding: 8px 14px; font-size: 13.5px; border-radius: 10px; }
      .spin-ic { display: inline-block; }
      .btn:hover .spin-ic { animation: spinOnce .6s ease; }
      @keyframes spinOnce { to { transform: rotate(360deg); } }
      .spinner {
        width: 16px; height: 16px;
        flex: none;
        border: 2.5px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .examples {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .examples span { margin-right: 2px; color: var(--ink-faint); font-size: 13px; font-weight: 700; }
      .chip {
        padding: 7px 12px;
        border: 1px solid #c4dfcb;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff, #e9f8ed);
        box-shadow: 0 5px 14px rgba(8, 114, 85, .09);
        color: #173d2c;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 13px;
        cursor: pointer;
        animation: chipIn .5s cubic-bezier(.22, .8, .35, 1) both;
        transition: transform .15s ease, border-color .15s ease, background .15s ease;
      }
      .examples .chip:nth-of-type(1) { animation-delay: .34s; }
      .examples .chip:nth-of-type(2) { animation-delay: .41s; }
      .examples .chip:nth-of-type(3) { animation-delay: .48s; }
      .examples .chip:nth-of-type(4) { animation-delay: .55s; }
      .examples .chip:nth-of-type(5) { animation-delay: .62s; }
      .examples .chip:nth-of-type(6) { animation-delay: .69s; }
      @keyframes chipIn {
        from { opacity: 0; transform: translateY(10px) scale(.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .chip:hover { transform: translateY(-2px); border-color: var(--green); background: #ddf5e4; color: var(--green-dark); }
      .chip:active { transform: scale(.95); }

      .status {
        display: none;
        margin-top: 16px;
        padding: 12px 15px;
        border-radius: 14px;
        font-size: 14.5px;
        animation: statusIn .35s cubic-bezier(.22, .8, .35, 1) both;
      }
      @keyframes statusIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .status.show { display: block; }
      .status.error { background: #fdeceb; color: #8c2b21; }
      .status.warn { background: #fdf3e0; color: #7a5410; }
      .status.info { background: #e6f7ee; color: #173d2c; }

      /* ---------- Animated result cards ---------- */
      .results { display: none; }
      .results.show { display: block; animation: resultsIn .45s ease both; }
      @keyframes resultsIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .card {
        padding: 0 0 14px;
        overflow: hidden;
        border-radius: 30px;
        transition: transform .3s ease, box-shadow .3s ease;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 28px 62px rgba(0, 0, 0, .30);
      }
      .results.show .card { animation: cardIn .68s cubic-bezier(.22, .8, .35, 1) both; }
      .results.show .grid .card:nth-child(2) { animation-delay: .12s; }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(24px) scale(.975); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .card-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 80px;
        margin-bottom: 8px;
        padding: 18px 22px;
        overflow: hidden;
        color: #ffffff;
        background: linear-gradient(90deg, #008c66, #00a878 48%, #56bd2f);
      }
      .grid .card:nth-child(2) .card-head {
        background: linear-gradient(90deg, #005f8f, #0089b8 50%, #00b3a4);
      }
      .card-head::after {
        content: "";
        position: absolute;
        top: 0;
        left: -80%;
        width: 42%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .24), transparent);
        transform: skewX(-20deg);
        animation: headSheen 4.6s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes headSheen {
        0%, 52% { left: -80%; }
        88%, 100% { left: 140%; }
      }
      .card-head h2 {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
        margin: 0;
        color: #ffffff;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .card-head h2::before {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px; height: 38px;
        flex: none;
        border: 1px solid rgba(255, 255, 255, .32);
        border-radius: 50%;
        background: rgba(255, 255, 255, .20);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        font-size: 19px;
      }
      .grid .card:first-child .card-head h2::before { content: "👤"; }
      .grid .card:nth-child(2) .card-head h2::before { content: "📍"; }
      .card-head .tag {
        position: relative;
        z-index: 1;
        flex: none;
        padding: 5px 10px;
        border: 1px solid rgba(255, 255, 255, .28);
        border-radius: 999px;
        background: rgba(255, 255, 255, .20);
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      dl.fields {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0;
        padding: 8px 14px 2px;
      }
      .field {
        display: grid;
        grid-template-columns: 118px 1fr auto;
        align-items: center;
        gap: 11px;
        margin: 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: linear-gradient(180deg, #ffffff, #f6fbf7);
        box-shadow: 0 3px 10px rgba(8, 114, 85, .035);
      }
      .results.show .field { animation: fieldIn .46s cubic-bezier(.22, .8, .35, 1) both; }
      .results.show .field:nth-child(1) { animation-delay: .08s; }
      .results.show .field:nth-child(2) { animation-delay: .13s; }
      .results.show .field:nth-child(3) { animation-delay: .18s; }
      .results.show .field:nth-child(4) { animation-delay: .23s; }
      .results.show .field:nth-child(5) { animation-delay: .28s; }
      .results.show .field:nth-child(6) { animation-delay: .33s; }
      .results.show .field:nth-child(7) { animation-delay: .38s; }
      .results.show .field:nth-child(8) { animation-delay: .43s; }
      .results.show .field:nth-child(9) { animation-delay: .48s; }
      .results.show .field:nth-child(10) { animation-delay: .53s; }
      .results.show .field:nth-child(11) { animation-delay: .58s; }
      .results.show .field:nth-child(12) { animation-delay: .63s; }
      @keyframes fieldIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .field dt {
        color: var(--ink-faint);

      .copy-btn {

      /* ---------- Session history ---------- */
      .history {
        display: none;
        margin-top: 24px;
        padding: 24px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 30px;
        background: linear-gradient(135deg, rgba(3, 34, 39, .72), rgba(4, 54, 48, .58));
        box-shadow: 0 22px 54px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .14);
        color: #ffffff;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .history.show { display: block; animation: riseIn .5s cubic-bezier(.22, .8, .35, 1) both; }
      .history h2 { margin: 0 0 6px; color: #ffffff; font-size: 17px; font-weight: 800; }
      .history p { margin: 0 0 13px; color: rgba(255, 255, 255, .68); font-size: 13.5px; }
      .history-list { margin: 0; padding: 0; list-style: none; }
      .history-list li + li { margin-top: 8px; }
      .history-item {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 14px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, .13);
        border-radius: 15px;
        background: rgba(255, 255, 255, .07);
        color: #ffffff;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: background .15s ease, transform .15s ease, border-color .15s ease;
      }
      .history.show .history-item { animation: riseIn .45s cubic-bezier(.22, .8, .35, 1) both; }
      .history.show li:nth-child(1) .history-item { animation-delay: .04s; }
      .history.show li:nth-child(2) .history-item { animation-delay: .10s; }
      .history.show li:nth-child(3) .history-item { animation-delay: .16s; }
      .history.show li:nth-child(4) .history-item { animation-delay: .22s; }
      .history.show li:nth-child(5) .history-item { animation-delay: .28s; }
      .history.show li:nth-child(6) .history-item { animation-delay: .34s; }
      .history-item:hover { transform: translateX(3px); border-color: rgba(255, 255, 255, .26); background: rgba(255, 255, 255, .11); }
      .history-item .who { font-size: 15px; font-weight: 800; }
      .history-item .where { color: rgba(255, 255, 255, .72); font-size: 14px; }
      .history-item .zipv { margin-left: auto; color: #c9f7a7; font-family: "IBM Plex Mono", monospace; font-size: 13px; }

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        "use strict";

        var zipInput = document.getElementById("zipInput");
        var generateBtn = document.getElementById("generateBtn");
        var newPersonBtn = document.getElementById("newPersonBtn");
        var statusBox = document.getElementById("statusBox");
        var results = document.getElementById("results");
        var personNameEl = document.getElementById("personName");
        var personFields = document.getElementById("personFields");
        var zipFields = document.getElementById("zipFields");
        var historyPanel = document.getElementById("historyPanel");
        var historyList = document.getElementById("historyList");
        var toast = document.getElementById("toast");

        var current = null;   // { zipData, person }
        var zipCache = {};    // zip -> zipData
        var history = [];     // generated records, newest first
        var toastTimer = null;

        /* ---------------- Local fallback data (used only if RandomUser.me is unreachable) ---------------- */
        var FALLBACK_FIRST = ["James","Mary","Robert","Patricia","John","Jennifer","Michael","Linda","David","Elizabeth","William","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen","Daniel","Nancy","Matthew","Lisa","Anthony","Betty","Mark","Margaret","Donald","Sandra","Steven","Ashley","Paul","Kimberly","Andrew","Emily","Kenneth","Michelle","Kevin","Dorothy","Brian","Amanda","George","Melissa","Timothy","Deborah","Ronald","Stephanie","Gary","Rebecca","Jason","Sharon","Jeffrey","Laura","Ryan","Cynthia","Jacob","Kathleen","Nicholas","Amy"];
        var FALLBACK_LAST = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell","Carter","Roberts","Gomez","Phillips","Evans","Turner","Diaz","Parker","Cruz","Edwards","Collins","Reyes","Stewart","Morris","Morales","Murphy","Cook"];
        var FALLBACK_STREETS = ["Main St","Oak Ave","Maple Dr","Cedar Ln","Elm St","Washington Ave","Lincoln Blvd","Park Ave","Hillcrest Dr","Sunset Blvd","River Rd","Highland Ave","Chestnut St","Walnut Ave","Spring St","Willow Creek Dr","Meadow Ln","Franklin St","Jefferson Ave","Madison St","Lakeview Dr","Pine St","Birchwood Ln","Magnolia Ave","Dogwood Dr","Harrison St","Monroe St","Adams Ave","Jackson St","Ridge Rd"];
        var FALLBACK_AREAS = ["212","312","415","512","617","704","813","917","206","303"];

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function fallbackPerson() {
          var year = 1950 + Math.floor(Math.random() * 55);         // 1950–2004
          var month = 1 + Math.floor(Math.random() * 12);
          var day = 1 + Math.floor(Math.random() * 28);
          var dob = new Date(Date.UTC(year, month - 1, day));
          var age = Math.floor((Date.now() - dob.getTime()) / 31557600000);
          var num = 100 + Math.floor(Math.random() * 9899);
          return {
            firstName: pick(FALLBACK_FIRST),
            middleName: pick(FALLBACK_FIRST),
            lastName: pick(FALLBACK_LAST),
            gender: "",
            dobDate: dob,
            age: age,
            phone: "(" + pick(FALLBACK_AREAS) + ") 555-01" + String(Math.floor(Math.random() * 100)).padStart(2, "0"),
            street: num + " " + pick(FALLBACK_STREETS),
            source: "local"
          };
        }

        /* ---------------- Helpers ---------------- */
        function showStatus(kind, html) {
          statusBox.className = "status show " + kind;
          statusBox.innerHTML = html;
        }
        function clearStatus() {
          statusBox.className = "status";
          statusBox.innerHTML = "";
        }
        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
        }
        function copyText(text, label) {
          function done() { showToast(label + " copied"); }
          function fallbackCopy() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); done(); }
            catch (e) { showToast("Copy failed — select the text manually"); }
            document.body.removeChild(ta);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallbackCopy);
          } else { fallbackCopy(); }
        }
        function fmtDate(d) {
          var m = String(d.getUTCMonth() + 1).padStart(2, "0");
          var day = String(d.getUTCDate()).padStart(2, "0");
          return m + "/" + day + "/" + d.getUTCFullYear();
        }
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function fieldRow(label, value, opts) {
          opts = opts || {};
          var v = (value === undefined || value === null || value === "") ? "—" : value;
          var ddClass = opts.mono ? ' class="mono"' : "";
          var copyBtn = (v !== "—")
            ? '<button type="button" class="copy-btn" data-copy="' + esc(v) + '" data-label="' + esc(label) + '">Copy</button>'
            : "";
          return '<div class="field"><dt>' + esc(label) + '</dt><dd' + ddClass + '>' + esc(v) + '</dd>' + copyBtn + '</div>';
        }

        /* ---------------- API calls ---------------- */
        function fetchZip(zip) {
          if (zipCache[zip]) return Promise.resolve(zipCache[zip]);
          return fetch("https://api.zippopotam.us/us/" + encodeURIComponent(zip))
            .then(function (r) {
              if (r.status === 404) { var e = new Error("notfound"); e.code = "notfound"; throw e; }
              if (!r.ok) throw new Error("ziphttp " + r.status);
              return r.json();
            })
            .then(function (data) {
              var place = data.places && data.places[0];
              if (!place) { var e2 = new Error("notfound"); e2.code = "notfound"; throw e2; }
              var zd = {
                zip: data["post code"],
                city: place["place name"],
                state: place["state"],
                stateAbbr: place["state abbreviation"],
                country: data["country"],
                lat: place["latitude"],
                lon: place["longitude"],
                allPlaces: data.places.map(function (p) { return p["place name"]; }),
                county: null
              };
              zipCache[zip] = zd;
              // County from the FCC census geocoder using the ZIP's coordinates (best effort).
              return fetch("https://geo.fcc.gov/api/census/block/find?latitude=" + encodeURIComponent(zd.lat) +
                           "&longitude=" + encodeURIComponent(zd.lon) + "&showall=false&format=json")
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (cj) {
                  if (cj && cj.County && cj.County.name) zd.county = cj.County.name;
                  return zd;
                })
                .catch(function () { return zd; });
            });
        }

        function fetchPerson() {
          return fetch("https://randomuser.me/api/?nat=us&inc=name,location,dob,phone,gender")
            .then(function (r) {
              if (!r.ok) throw new Error("personhttp " + r.status);
              return r.json();
            })
            .then(function (data) {
              var u = data.results && data.results[0];
              if (!u) throw new Error("empty person");
              var dob = new Date(u.dob.date);
              return {
                firstName: u.name.first,
                middleName: pick(FALLBACK_FIRST),
                lastName: u.name.last,
                gender: u.gender ? (u.gender.charAt(0).toUpperCase() + u.gender.slice(1)) : "",
                dobDate: dob,
                age: u.dob.age,
                phone: u.phone,
                street: u.location.street.number + " " + u.location.street.name,
                source: "randomuser"
              };
            })
            .catch(function () { return fallbackPerson(); });
        }

        /* ---------------- Rendering ---------------- */
        function fullAddress(rec) {
          var z = rec.zipData, p = rec.person;
          return p.street + ", " + z.city + ", " + z.stateAbbr + " " + z.zip;
        }

        function render(rec) {
          current = rec;
          var z = rec.zipData, p = rec.person;

          personNameEl.textContent = p.firstName + " " + (p.middleName ? p.middleName + " " : "") + p.lastName;
          var ph = "";
          ph += fieldRow("First name", p.firstName);
          if (p.middleName) ph += fieldRow("Middle name", p.middleName);
          ph += fieldRow("Last name", p.lastName);
          if (p.gender) ph += fieldRow("Gender", p.gender);
          ph += fieldRow("Date of birth", fmtDate(p.dobDate) + "  (age " + p.age + ")", { mono: true });
          ph += fieldRow("Phone", p.phone, { mono: true });
          ph += fieldRow("Street address", p.street);
          ph += fieldRow("City", z.city);
          ph += fieldRow("State", z.state + " (" + z.stateAbbr + ")");
          ph += fieldRow("ZIP code", z.zip, { mono: true });
          ph += fieldRow("County", z.county);
          ph += fieldRow("Full address", fullAddress(rec));
          personFields.innerHTML = ph;

          var zh = "";
          zh += fieldRow("ZIP code", z.zip, { mono: true });
          zh += fieldRow("City", z.city);
          zh += fieldRow("State", z.state);
          zh += fieldRow("State code", z.stateAbbr, { mono: true });
          zh += fieldRow("County", z.county);
          zh += fieldRow("Country", z.country);
          zh += fieldRow("Latitude", z.lat, { mono: true });
          zh += fieldRow("Longitude", z.lon, { mono: true });
          if (z.allPlaces.length > 1) {
            zh += fieldRow("Also served", z.allPlaces.join(", "));
          }
          zipFields.innerHTML = zh;

          results.classList.add("show");
        }

        function recordAsText(rec) {
          var z = rec.zipData, p = rec.person;
          var lines = [
            "First Name: " + p.firstName,
            "Middle Name: " + (p.middleName || ""),
            "Last Name: " + p.lastName,
            "Full Name: " + p.firstName + " " + (p.middleName ? p.middleName + " " : "") + p.lastName,
            "Date of Birth: " + fmtDate(p.dobDate),
            "Age: " + p.age,
            "Phone: " + p.phone,
            "Street Address: " + p.street,
            "City: " + z.city,
            "State: " + z.state + " (" + z.stateAbbr + ")",
            "ZIP Code: " + z.zip,
            "County: " + (z.county || ""),
            "Full Address: " + fullAddress(rec)
          ];
          if (p.gender) lines.splice(3, 0, "Gender: " + p.gender);
          return lines.join("\n");
        }

        function recordAsJson(rec) {
          var z = rec.zipData, p = rec.person;
          return JSON.stringify({
            firstName: p.firstName,
            middleName: p.middleName || undefined,
            lastName: p.lastName,
            fullName: p.firstName + " " + (p.middleName ? p.middleName + " " : "") + p.lastName,
            gender: p.gender || undefined,
            dateOfBirth: fmtDate(p.dobDate),
            age: p.age,
            phone: p.phone,
            streetAddress: p.street,
            city: z.city,
            state: z.state,
            stateCode: z.stateAbbr,
            zipCode: z.zip,
            county: z.county || undefined,
            fullAddress: fullAddress(rec),
            latitude: z.lat,
            longitude: z.lon
          }, null, 2);
        }

        function addToHistory(rec) {
          history.unshift(rec);
          if (history.length > 10) history.length = 10;
          historyList.innerHTML = "";
          history.forEach(function (r, i) {
            var li = document.createElement("li");
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "history-item";
            btn.innerHTML =
              '<span class="who">' + esc(r.person.firstName + " " + (r.person.middleName ? r.person.middleName + " " : "") + r.person.lastName) + '</span>' +
              '<span class="where">' + esc(r.zipData.city + ", " + r.zipData.stateAbbr) +
              (r.zipData.county ? " · " + esc(r.zipData.county) : "") + '</span>' +
              '<span class="zipv">' + esc(r.zipData.zip) + '</span>';
            btn.addEventListener("click", function () {
              zipInput.value = r.zipData.zip;
              clearStatus();
              render(r);
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
            li.appendChild(btn);
            historyList.appendChild(li);
          });
          historyPanel.classList.add("show");
        }

        /* ---------------- Main actions ---------------- */
        function setBusy(busy) {
          generateBtn.disabled = busy;
          newPersonBtn.disabled = busy;
          generateBtn.innerHTML = busy
            ? '<span class="spinner"></span> Looking up…'
            : "Look up ZIP &amp; generate person";
        }

        function generate(zip) {
          clearStatus();
          if (!/^\d{5}$/.test(zip)) {
            showStatus("error", "Please enter a valid 5-digit US ZIP code.");
            zipInput.focus();
            return;
          }
          setBusy(true);
          Promise.all([fetchZip(zip), fetchPerson()])
            .then(function (pair) {
              var rec = { zipData: pair[0], person: pair[1] };
              render(rec);
              addToHistory(rec);
              if (rec.person.source === "local") {
                showStatus("warn", "The person generator was unreachable, so this record was generated locally instead — the ZIP, city, state and county are still live results.");
              } else if (!rec.zipData.county) {
                showStatus("info", "ZIP found. The county lookup didn’t return a result for this ZIP’s coordinates, so the county field is blank.");
              }
            })
            .catch(function (err) {
              if (err && err.code === "notfound") {
                showStatus("error", "ZIP code <strong>" + esc(zip) + "</strong> was not found. Check the number and try again — e.g. 10001 (New York) or 90210 (Beverly Hills).");
              } else {
                showStatus("error", "The ZIP lookup service could not be reached. Check your connection and try again.");
              }
            })
            .then(function () { setBusy(false); });
        }

        function newPerson() {
          if (!current) return;
          setBusy(true);
          clearStatus();
          fetchPerson().then(function (p) {
            var rec = { zipData: current.zipData, person: p };
            render(rec);
            addToHistory(rec);
            setBusy(false);
            if (p.source === "local") {
              showStatus("warn", "The person generator was unreachable, so this person was generated locally instead.");
            }
          });
        }

        /* ---------------- Wiring ---------------- */
        generateBtn.addEventListener("click", function () { generate(zipInput.value.trim()); });
        newPersonBtn.addEventListener("click", newPerson);
        zipInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); generate(zipInput.value.trim()); }
        });
        zipInput.addEventListener("input", function () {
          zipInput.value = zipInput.value.replace(/\D/g, "").slice(0, 5);
        });
        document.querySelectorAll(".chip").forEach(function (chip) {
          chip.addEventListener("click", function () {
            zipInput.value = chip.getAttribute("data-zip");
            generate(chip.getAttribute("data-zip"));
          });
        });
        document.getElementById("copyTextBtn").addEventListener("click", function () {
          if (current) copyText(recordAsText(current), "Full record");
        });
        document.getElementById("copyJsonBtn").addEventListener("click", function () {
          if (current) copyText(recordAsJson(current), "JSON record");
        });
        // Per-field copy buttons (event delegation — rows are re-rendered)
        document.addEventListener("click", function (e) {
          var btn = e.target.closest ? e.target.closest(".copy-btn") : null;
          if (btn) copyText(btn.getAttribute("data-copy"), btn.getAttribute("data-label"));
        });

        zipInput.focus();
      })();
    </script>
    <footer class="site-footer">Author: Satheesan</footer>
  </body>
